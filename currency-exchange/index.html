<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Exchange</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light py-5">
    <div class="container">
      <div class="row justify-content-center mb-4">
        <div class="col-md-8 col-lg-6">
          <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
              <h3 class="card-title text-center mb-4 fw-bold text-primary">
                <i class="bi bi-currency-exchange me-2"></i>Currency Exchange
              </h3>

              <form id="exchangeForm">
                <div class="mb-4">
                  <label
                    for="toCurrency"
                    class="form-label fw-semibold text-secondary"
                  >
                    Convert to currency
                  </label>
                  <select class="form-select form-control-lg" id="toCurrency">
                    <option value="USD">USD - US Dollar</option>
                    <option value="EUR" selected>EUR - Euro</option>
                    <option value="PLN">PLN - Zloty</option>
                    <option value="GBP">GBP - Pound</option>
                  </select>
                </div>

                <hr class="my-4 text-muted" />

                <h5 class="fw-bold mb-3 text-secondary">
                  <i class="bi bi-calendar3 me-2"></i>Archival course by period
                </h5>

                <div class="btn-group w-100 mb-3" role="group">
                  <input
                    type="radio"
                    class="btn-check"
                    name="dateType"
                    id="typeDay"
                    value="day"
                    checked
                  />
                  <label class="btn btn-outline-primary" for="typeDay"
                    >By days</label
                  >

                  <input
                    type="radio"
                    class="btn-check"
                    name="dateType"
                    id="typeMonth"
                    value="month"
                  />
                  <label class="btn btn-outline-primary" for="typeMonth"
                    >By month</label
                  >

                  <input
                    type="radio"
                    class="btn-check"
                    name="dateType"
                    id="typeYear"
                    value="year"
                  />
                  <label class="btn btn-outline-primary" for="typeYear"
                    >By year</label
                  >
                </div>

                <div id="dateInputsContainer" class="mb-4">
                  <div id="inputStartDay" class="date-input-group">
                    <label
                      for="datePickerStartDay"
                      class="form-label text-muted"
                      >Select a specific start day</label
                    >
                    <input
                      type="date"
                      class="form-control"
                      id="datePickerStartDay"
                      value="2026-07-09"
                    />
                  </div>

                  <div id="inputEndDay" class="date-input-group mt-4">
                    <label for="datePickerEndDay" class="form-label text-muted"
                      >Select a specific end day</label
                    >
                    <input
                      type="date"
                      class="form-control"
                      id="datePickerEndDay"
                      value="2026-07-09"
                    />
                  </div>

                  <div id="inputMonth" class="date-input-group d-none">
                    <label for="datePickerMonth" class="form-label text-muted"
                      >Select the month and year</label
                    >
                    <input
                      type="month"
                      class="form-control"
                      id="datePickerMonth"
                      value="2026-07"
                    />
                  </div>

                  <div id="inputYear" class="date-input-group d-none">
                    <label for="datePickerYear" class="form-label text-muted"
                      >Select the year</label
                    >
                    <input
                      type="number"
                      class="form-control"
                      id="datePickerYear"
                      min="1990"
                      max="2030"
                      value="2026"
                    />
                  </div>
                </div>

                <button
                  type="submit"
                  class="btn btn-primary btn-lg w-100 rounded-3 shadow-sm fw-bold"
                >
                  Calculate the exchange rate
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
      <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
          <div
            id="resultBlock"
            class="p-4 bg-white shadow-sm rounded-4 d-none text-center position-relative"
            style="height: 400px"
          >
            <span class="text-muted d-block small mb-3" id="resultMeta">
              Exchange rate for the specified date
            </span>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
  </body>
</html>
